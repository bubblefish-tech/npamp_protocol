[package]
name = "npamp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Open reference implementation of N-PAMP (draft-bubblefish-npamp-01) wire format."

[dependencies]
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
hmac = "0.12"
ed25519-dalek = "2.2"

# Optional: the `session` feature's live handshake + record-layer adoption API
# (src/session.rs) needs the X25519MLKEM768 hybrid KEM operations. Kept optional,
# behind a default-on feature (see [features] below), so a consumer who wants the
# strict wire-only library — no post-quantum KEM dependency at all — can
# `cargo build --no-default-features` and drop this module entirely.
#
# ML-KEM-768 (FIPS 203): session::Session::dial/accept encapsulate/decapsulate
# against it; the handshake-flow KAT (tests/handshake_flow_kat.rs and the pinned-
# vector unit test in src/session.rs) decapsulates the pinned captured-once
# ciphertext under the pinned d||z seed and MUST recover the pinned shared secret.
ml-kem = { version = "0.2", features = ["deterministic"], optional = true }
# The Decapsulate trait ml-kem's DecapsulationKey implements lives in the `kem`
# crate (ml-kem re-uses RustCrypto's KEM trait); import it to call decapsulate.
kem = { version = "=0.3.0-pre.0", optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
# OS entropy for session::generate_identity and the ephemeral X25519 + ML-KEM-768
# key material session::Session::dial/accept generate: filled from the OS CSPRNG,
# then fed to the deterministic keygen constructors so no rand_core trait plumbing
# (or C-based provider) is pulled in.
getrandom = { version = "0.2", optional = true }
[features]
default = ["session"]
# The live handshake + record-layer adoption API (src/session.rs). Pulls in the
# post-quantum ML-KEM dependency above; disable with --no-default-features for the
# strict wire-format-only library (frame codec, key schedule, handshake-binding
# primitives, no KEM operations, no network/transport code) this crate started as.
session = ["dep:ml-kem", "dep:kem", "dep:x25519-dalek", "dep:getrandom"]

# The two live-network interop examples use npamp::session, so Cargo must skip
# building them (rather than error) under --no-default-features.
[[example]]
name = "interop_client"
required-features = ["session"]

[[example]]
name = "interop_server"
required-features = ["session"]
