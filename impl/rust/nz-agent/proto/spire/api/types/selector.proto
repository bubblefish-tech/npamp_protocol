syntax = "proto3";

package spire.api.types;

option go_package = "github.com/spiffe/spire-api-sdk/proto/spire/api/types";

// Represents a selector.
message Selector {
    // The type of the selector. This is typically the name of the plugin
    // that produces the selector.
    string type = 1;

    // The value of the selector.
    string value = 2;
}
