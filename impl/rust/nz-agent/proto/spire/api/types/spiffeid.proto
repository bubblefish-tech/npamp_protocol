syntax = "proto3";

package spire.api.types;

option go_package = "github.com/spiffe/spire-api-sdk/proto/spire/api/types";

// Represents a SPIFFE ID.
message SPIFFEID {
    // Trust domain portion the SPIFFE ID (e.g. "example.org").
    string trust_domain = 1;

    // Path component of the SPIFFE ID. This value has a leading slash and
    // requires normalization before comparing SPIFFE IDs.
    string path = 2;
}
