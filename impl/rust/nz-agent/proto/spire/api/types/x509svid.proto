syntax = "proto3";

package spire.api.types;

option go_package = "github.com/spiffe/spire-api-sdk/proto/spire/api/types";

import "spire/api/types/spiffeid.proto";

// Represents an X509-SVID.
message X509SVID {
    // Certificate and intermediates required to form a chain of trust back
    // to the X.509 authorities. Ordered leaf first.
    repeated bytes cert_chain = 1;

    // SPIFFE ID of the SVID.
    spire.api.types.SPIFFEID id = 2;

    // Expiration timestamp (seconds since Unix epoch).
    int64 expires_at = 3;

    // Optional operator-specified guidance string for the workload identity.
    string hint = 4;
}
